name: ci

# Two different questions, two jobs.
#
# `test` asks: do the COMMITTED wasms work? That is what a consumer gets from
# npm, and it needs no toolchain, so it runs on every push in about a minute.
#
# `build-runtimes` asks: can those wasms still be REPRODUCED from source? That
# needs emsdk and takes far longer, and it is the only thing that catches a
# committed binary drifting away from the runtime.c it supposedly came from.
#
# The existing test.yml covers the pure-JS surface (packaging, tarball,
# headless import). This file is specifically about runtimes/.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  # Real GL on a runner with no GPU and no display.
  #
  # All three are required. llvmpipe is Mesa's software rasteriser; surfaceless
  # is the EGL platform that needs neither an X/Wayland display nor a DRM
  # device. Verified locally with DISPLAY unset: without EGL_PLATFORM the
  # context dies at "eglInitialize failed" and 18 tests skip; with it the suite
  # is 98/98. See the "Software OpenGL" step below.
  LIBGL_ALWAYS_SOFTWARE: '1'
  GALLIUM_DRIVER: llvmpipe
  EGL_PLATFORM: surfaceless
  # Pin the toolchain that produced the committed wasms. An unpinned "latest"
  # would make the drift check below meaningless -- every emsdk bump would
  # report a size delta that says nothing about whether the SOURCE changed.
  EMSDK_VERSION: 4.0.18

jobs:
  test:
    name: test (committed wasms)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Software GL, so the OpenGL tests actually RUN on a runner with no GPU.
      #
      # Without it, 18 tests skip -- every GPU/CPU pixel-parity check, the
      # offscreen-surface tests, the shader-preset tests -- which is most of
      # what this package does. Mesa's llvmpipe gives a real GLES 3 context
      # through EGL's surfaceless platform, needing neither a display nor a
      # DRM device. See the EGL_PLATFORM/GALLIUM_DRIVER env above.
      - name: Software OpenGL (llvmpipe)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1-mesa-dri libgbm1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # The runtime tests SKIP a language whose main.wasm is absent, which is
      # right for a working tree mid-rebuild but wrong for CI: a repo that
      # dropped a wasm would go green with a quarter of the suite silently
      # missing. Assert all four are present BEFORE testing, so a skip can
      # only ever mean something the suite itself decided.
      - name: All four runtimes are committed
        run: |
          missing=0
          for rt in lua js python ruby; do
            if [ ! -f "runtimes/$rt/main.wasm" ]; then
              echo "::error::runtimes/$rt/main.wasm is missing from the repo"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "all four runtimes present"

      - name: Install
        run: npm ci || npm install

      # Runs check-runtimes via the pretest hook, then the suite.
      #
      # ONE invocation, captured. A skipped test means a runtime failed to
      # LOAD despite its wasm being present -- a real regression that a plain
      # "tests passed" would hide, because node:test exits 0 with skips. So
      # the exit code and the skip count are two separate questions and both
      # are asked here, of the same run: running the suite twice would double
      # the job for no extra signal.
      #
      # PIPESTATUS, not `|| exit 1`: the pipe into tee means $? is tee's
      # status, which is 0 even when the suite failed.
      - name: Verify runtimes and test
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/test.log
          status=$?
          skipped=$(grep -E '^. skipped ' /tmp/test.log | tail -1 | grep -oE '[0-9]+$')

          # A GPU-less runner cannot run the GL tests, and those skips are
          # expected forever. Every OTHER skip means a runtime failed to LOAD
          # despite its wasm being committed -- a real regression that a plain
          # "tests passed" would hide, because node:test exits 0 with skips.
          # So subtract the known-unavoidable ones and gate on the remainder.
          # Only ONE skip reason is legitimate here: no RetroArch shader
          # corpus on the runner. GL is no longer among them -- llvmpipe is
          # installed above, so an "OpenGL ES context unavailable" skip now
          # means software GL broke and must fail the build rather than
          # quietly halving the suite.
          #
          # Every other skip means a runtime failed to LOAD despite its wasm
          # being committed -- a real regression a plain "tests passed" would
          # hide, since node:test exits 0 with skips.
          #
          # Matched by REASON, not by counting: a skipped `describe` reports
          # one line but several skipped subtests, so line counts and the
          # summary total do not agree.
          unexpected=$(grep -E '^﹣' /tmp/test.log \
            | grep -v 'no shaders_glsl on this machine' \
            | grep -v 'preset not installed' || true)
          echo "exit=${status} skipped=${skipped:-0}"
          if [ -n "$unexpected" ]; then
            echo "::error::test(s) skipped for reasons other than a missing GPU or shader corpus"
            echo "$unexpected" | head -20
            exit 1
          fi
          exit "$status"

  build-runtimes:
    name: rebuild from source
    runs-on: ubuntu-latest
    # Rebuilding four language engines from source is minutes, not seconds.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # Software GL, so the OpenGL tests actually RUN on a runner with no GPU.
      #
      # Without it, 18 tests skip -- every GPU/CPU pixel-parity check, the
      # offscreen-surface tests, the shader-preset tests -- which is most of
      # what this package does. Mesa's llvmpipe gives a real GLES 3 context
      # through EGL's surfaceless platform, needing neither a display nor a
      # DRM device. See the EGL_PLATFORM/GALLIUM_DRIVER env above.
      - name: Software OpenGL (llvmpipe)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1-mesa-dri libgbm1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # mruby's build system is rake, so a host ruby is required before emsdk
      # is even relevant. Ubuntu runners ship one; make it explicit so a
      # runner image change fails loudly here instead of deep inside rake.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install rake
        run: gem install rake --no-document

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          # Cache the emsdk install itself; it is ~1GB and identical run over run.
          actions-cache-folder: emsdk-cache-${{ env.EMSDK_VERSION }}

      - name: Toolchain versions
        run: |
          emcc --version | head -1
          node --version
          ruby --version

      # The engine source trees are the slow part: MicroPython and mruby are
      # git clones, QuickJS is a clone when no donor checkout exists, and Lua
      # is a tarball fetch. Key on the build inputs that decide WHICH source
      # gets fetched -- build.sh (holds the pinned version) plus each
      # runtime's config. A change to runtime.c must NOT bust this cache;
      # runtime.c is compiled every run regardless and only the vendored
      # engine is being cached.
      - name: Cache engine source trees
        uses: actions/cache@v6
        with:
          path: |
            runtimes/lua/vendor
            runtimes/js/vendor
            runtimes/js/obj
            runtimes/python/vendor
            runtimes/python/micropython_embed
            runtimes/ruby/vendor
          key: engines-${{ env.EMSDK_VERSION }}-${{ hashFiles('runtimes/*/build.sh', 'runtimes/lua/abconf.h', 'runtimes/lua/patch-lua.py', 'runtimes/python/mpconfigport.h', 'runtimes/python/micropython_embed.mk', 'runtimes/ruby/mruby_wasm_config.rb') }}
          # NO restore-keys, deliberately.
          #
          # These caches hold VENDORED ENGINE SOURCE, and build.sh is what
          # decides which source gets fetched -- the QuickJS pin lives there.
          # A prefix fallback would restore a tree fetched by an older build.sh
          # and the new pin would never take effect, because the clone is
          # skipped whenever vendor/ already exists. That is exactly what
          # happened: the QuickJS pin landed and CI still rebuilt the old
          # 566 KB wasm from a cached HEAD clone.
          #
          # An exact-match-only key means changing a build script costs one
          # cold rebuild and then reproduces what it says it does.

      - name: Install
        run: npm ci || npm install

      # Keep the committed artifacts to compare against after the rebuild.
      # Copied, not moved: a build.sh that fails early must leave the repo's
      # own wasm in place so the later steps still have something to check.
      - name: Snapshot committed wasms
        run: |
          mkdir -p /tmp/committed
          for rt in lua js python ruby; do
            cp "runtimes/$rt/main.wasm" "/tmp/committed/$rt.wasm"
          done

      # Each build.sh self-verifies imports/exports and exits 1 on violation,
      # so a broken ABI fails right here. Built separately so the log says
      # which language broke.
      - name: Build lua
        run: ./runtimes/lua/build.sh
      - name: Build js
        run: ./runtimes/js/build.sh
      - name: Build python
        run: ./runtimes/python/build.sh
      - name: Build ruby
        run: ./runtimes/ruby/build.sh

      # Independent of the per-build assertions: budgets, ab_host-only
      # imports, and the five exports, checked against sdk/abi.json.
      - name: Check rebuilt runtimes
        run: node scripts/check-runtimes.mjs

      # The real proof that a rebuild is usable: the same 50 tests, now
      # running against the freshly built wasms rather than the committed ones.
      - name: Test against rebuilt wasms
        run: npm test

      # Drift is a WARNING, not a failure, on purpose. Emscripten output is
      # not bit-reproducible ACROSS versions (build paths, temp filenames and
      # LLVM ordering all leak in), so gating on bytes would fail for reasons
      # unrelated to the source.
      #
      # Within a pinned emsdk it does hold: on 4.0.18 all four engines rebuild
      # byte-identical to the committed artifacts (verified locally
      # 2026-07-31, deltas +0 across lua/js/python/ruby). So an "identical: no"
      # on an unchanged EMSDK_VERSION is a real signal worth reading, not
      # expected noise.
      # A SIZE delta, though, is a genuine signal: same emsdk in, materially
      # different size out, means runtime.c or an engine pin moved without
      # the committed wasm being regenerated. Surface it, do not gate on it.
      - name: Drift check (committed vs rebuilt)
        if: always()
        run: |
          {
            echo "## Runtime sizes"
            echo ""
            echo "| runtime | committed | rebuilt | delta | identical |"
            echo "| --- | ---: | ---: | ---: | :---: |"
          } >> "$GITHUB_STEP_SUMMARY"

          drifted=0
          for rt in lua js python ruby; do
            new="runtimes/$rt/main.wasm"
            old="/tmp/committed/$rt.wasm"
            [ -f "$new" ] || continue
            newsize=$(wc -c < "$new")
            oldsize=$(wc -c < "$old")
            delta=$((newsize - oldsize))
            if cmp -s "$old" "$new"; then
              same="yes"
            else
              same="no"
              drifted=1
            fi
            printf '| %s | %s | %s | %+d | %s |\n' \
              "$rt" "$oldsize" "$newsize" "$delta" "$same" >> "$GITHUB_STEP_SUMMARY"
          done

          {
            echo ""
            if [ "$drifted" -eq 0 ]; then
              echo "Every rebuilt wasm is byte-identical to the committed one."
            else
              echo "> [!NOTE]"
              echo "> At least one rebuilt wasm differs from the committed bytes."
              echo "> This is expected when the toolchain or an engine pin moved, and is"
              echo "> **not** a failure: emscripten output is not reliably bit-reproducible."
              echo "> A large size delta is the part worth looking at -- it suggests the"
              echo "> committed artifact was not regenerated after a source change."
              echo "> To refresh: run the runtime's build.sh and commit the new main.wasm."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Upload the rebuilt binaries so a drift warning can actually be
      # investigated: download, diff, decide whether to commit them.
      - name: Upload rebuilt wasms
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rebuilt-runtimes
          path: runtimes/*/main.wasm
          if-no-files-found: warn
